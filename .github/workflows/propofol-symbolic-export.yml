name: Propofol symbolic equation export

# Export is intentionally manual: the pinned upstream network is unchanged
# across BET commits, and each export installs Julia and validates a large model.
concurrency:
  group: propofol-symbolic-export-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  export-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out BET
        uses: actions/checkout@v4
      - name: Check out original covariate-structure repository
        uses: actions/checkout@v4
        with:
          repository: wahlquisty/learning-pharmacometric-covariate-structures
          ref: 939d30699fa6157c14c601712882c51106b82a24
          path: upstream-covariate-structures
      - name: Verify original trained model bytes
        shell: bash
        run: |
          actual=$(git -C upstream-covariate-structures hash-object symbreg/bson/bson_ALE/nn_thread1loss_ALE.bson)
          test "$actual" = "aec9732b21a2beaec315eaefebb37699546f9dfa"
          echo "Verified original trained BSON model bytes: $actual"
      - name: Install Python for artifact validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.8.4"
      - name: Cache Julia packages
        uses: julia-actions/cache@v2
      - name: Export and numerically validate published equations
        run: julia --color=yes Examples/PropofolCovariates/export_symbolic_equations.jl "$GITHUB_WORKSPACE/upstream-covariate-structures"
      - name: Verify exported TOML structure
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          path = pathlib.Path("Examples/PropofolCovariates/symbolic_equations.toml")
          data = tomllib.loads(path.read_text())
          expected = ["k10", "k12", "k13", "k21", "k31", "V1"]
          equations = data["equations"]
          assert data["source_commit"] == "939d30699fa6157c14c601712882c51106b82a24"
          assert data["source_model_git_blob_sha"] == "aec9732b21a2beaec315eaefebb37699546f9dfa"
          assert data["julia_version"] == "1.8.4"
          assert data["validation"]["covariate_combinations"] == 5
          assert data["output_order"] == expected
          assert len(data["reference_predictions"]) == 5
          assert all(isinstance(equations["common"][name], str) and equations["common"][name] for name in expected)
          assert set(equations["male"]) == {"k13", "k31"}
          assert set(equations["female"]) == {"k13", "k31"}
          print(f"Validated TOML structure: {len(expected)} common equations and four sex-specific equations.")
          PY
      - name: Verify exported equations run in the Python JAX consumer
        shell: bash
        run: |
          python -m pip install --quiet "jax[cpu]" scipy numpy
          PYTHONPATH=Examples/PropofolCovariates python - <<'PY'
          import numpy as np
          import jax
          import jax.numpy as jnp
          from published_equations import load_equations, published_parameters, validate_reference_predictions

          import tomllib
          from pathlib import Path

          artifact = tomllib.loads(Path("Examples/PropofolCovariates/symbolic_equations.toml").read_text())
          equations = load_equations()
          # Apply the same provenance and Julia-network parity gate as inference.
          validate_reference_predictions(equations, artifact)
          for reference in artifact["reference_predictions"]:
              patient = reference["covariates"]
              covariates = jnp.array(patient)
              params = published_parameters(equations, covariates)
              jacobian = jax.jacrev(lambda x: published_parameters(equations, x))(covariates)
              if not bool(jnp.all(jnp.isfinite(params) & (params > 0))):
                  raise ValueError(f"Nonphysical exported PK parameters for {patient}: {params}")
              if not bool(jnp.all(jnp.isfinite(jacobian))):
                  raise ValueError(f"Nonfinite exported PK Jacobian for {patient}")
          print("Verified exported equations in JAX for five patient profiles and their Jacobians.")
          PY
      - name: Upload validated equation artifact
        uses: actions/upload-artifact@v4
        with:
          name: propofol-symbolic-equations
          path: Examples/PropofolCovariates/symbolic_equations.toml
          if-no-files-found: error
