name: BET tests

on:
  push:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest reportlab 'pypdf>=5,<7' requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: Generate and validate documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python docs/generators/markdown_to_pdf.py docs/Manual.md
          python docs/generators/cheatsheet.py
          python -c 'from pathlib import Path; from pypdf import PdfReader; assert all(Path(p).exists() and Path(p).stat().st_size for p in ["docs/Manual.md", "docs/Cheatsheet.md"]); assert len(PdfReader("docs/Manual.pdf").pages) >= 1; n=len(PdfReader("docs/Cheatsheet.pdf").pages); print(f"Cheatsheet pages: {n}"); assert n == 1, f"Expected one-page cheatsheet, got {n} pages"'
      - name: Upload generated documentation
        uses: actions/upload-artifact@v4
        with:
          name: bet-docs
          path: |
            docs/Manual.md
            docs/Manual.pdf
            docs/Cheatsheet.md
            docs/Cheatsheet.pdf
      - name: Run tests
        env:
          JAX_PLATFORMS: cpu
          XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
        run: |
          cd ..
          python -m pytest -q BayesianEstimationTool/tests
