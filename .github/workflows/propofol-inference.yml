name: Propofol covariate inference

on:
  workflow_dispatch:
    inputs:
      run_published:
        description: "Also compare the original published equations (requires validated Julia export for this commit)"
        type: boolean
        default: false
      smoke_only:
        description: "Run only the 10-patient SVI smoke test (skip development fit)"
        type: boolean
        default: true
      global_samples:
        description: "Population posterior draws per model (1 for smoke; larger values increase conditional SVI cost)"
        type: number
        default: 1
      full_cohort:
        description: "After smoke, fit all 831 training patients and score eligible held-out patients (resource-intensive)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  development-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject conflicting experiment settings
        if: ${{ inputs.full_cohort && inputs.smoke_only }}
        run: |
          echo 'full_cohort=true requires smoke_only=false; otherwise the full experiment is skipped.' >&2
          exit 1
      - name: Validate population posterior sample count
        run: |
          if ! [[ "${{ inputs.global_samples }}" =~ ^[1-9][0-9]*$ ]]; then
            echo "global_samples must be a positive integer." >&2
            exit 1
          fi
      - name: Install BET and numerical dependencies
        run: python -m pip install -e . numpy pandas scipy "jax[cpu]" numpyro pytest
      - name: Run synthetic regression tests before inference
        run: python -m pytest -q Examples/PropofolCovariates/test_*.py
      - name: Download upstream data
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/download_data.py 2>&1 | tee propofol-download.log
      - name: Check patient universe and measurements
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/inspect_data.py 2>&1 | tee propofol-data-check.log
      - name: Score supplied Eleveld parameters on matching held-out patients
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          reference_patients=25
          if [ "${{ inputs.smoke_only }}" = "true" ]; then reference_patients=5; fi
          python -u Examples/PropofolCovariates/eleveld_reference.py --test-patients "$reference_patients" --output-csv propofol-dev-eleveld.csv 2>&1 | tee propofol-eleveld-run.log
      - name: Independently score Eleveld with SciPy
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          reference_patients=25
          if [ "${{ inputs.smoke_only }}" = "true" ]; then reference_patients=5; fi
          python -u Examples/PropofolCovariates/scipy_reference.py --test-patients "$reference_patients" --output-csv propofol-dev-scipy.csv 2>&1 | tee propofol-scipy-reference.log
      - name: Check SciPy and JAX reference agreement
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python Examples/PropofolCovariates/compare_references.py propofol-dev-eleveld.csv propofol-dev-scipy.csv
      - name: Run minimal end-to-end SVI smoke test
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/compare_covariates.py --train-patients 10 --test-patients 5 --train-steps 20 --test-steps 10 --global-samples "${{ inputs.global_samples }}" --output-csv propofol-smoke-scores.csv 2>&1 | tee propofol-smoke-run.log
      - name: Summarize smoke-test paired held-out errors
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python Examples/PropofolCovariates/summarize_scores.py propofol-smoke-scores.csv
      - name: Run development comparison (100 train, up to 25 test)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.smoke_only && !inputs.full_cohort }}
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/compare_covariates.py --train-steps 1000 --test-steps 300 --global-samples "${{ inputs.global_samples }}" --output-csv propofol-dev-scores.csv 2>&1 | tee propofol-dev-run.log
      - name: Summarize exported paired held-out errors
        if: ${{ success() && github.event_name == 'workflow_dispatch' && !inputs.smoke_only && !inputs.full_cohort }}
        run: python Examples/PropofolCovariates/summarize_scores.py propofol-dev-scores.csv
      - name: Run full-cohort comparison (831 train, up to 200 test)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_cohort && !inputs.smoke_only }}
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/compare_covariates.py --full --train-steps 2000 --test-steps 500 --global-samples "${{ inputs.global_samples }}" --output-csv propofol-full-scores.csv 2>&1 | tee propofol-full-run.log
      - name: Summarize full-cohort paired errors
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.full_cohort && !inputs.smoke_only }}
        run: python Examples/PropofolCovariates/summarize_scores.py propofol-full-scores.csv
      - name: Download validated published symbolic equations
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_published }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Search by commit SHA server-side; a busy repository can have more
          # than 20 newer exports before the matching run is requested.
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/propofol-symbolic-export.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No successful symbolic-equation export for this exact BET commit ($GITHUB_SHA)." >&2
            echo "Run propofol-symbolic-export.yml on this commit before dispatching inference." >&2
            exit 1
          fi
          gh run download "$run_id" --name propofol-symbolic-equations --dir Examples/PropofolCovariates
          test -s Examples/PropofolCovariates/symbolic_equations.toml
          python - <<'PY'
          import pathlib
          import tomllib

          artifact = tomllib.loads(pathlib.Path("Examples/PropofolCovariates/symbolic_equations.toml").read_text())
          assert artifact["source_commit"] == "939d30699fa6157c14c601712882c51106b82a24", "Unexpected upstream source commit"
          assert artifact["source_model_git_blob_sha"] == "aec9732b21a2beaec315eaefebb37699546f9dfa", "Unexpected original BSON"
          assert artifact["output_order"] == ["k10", "k12", "k13", "k21", "k31", "V1"], "Unexpected equation order"
          assert len(artifact["reference_predictions"]) == 5, "Missing original-network parity references"
          print("Validated downloaded published-equation artifact provenance and reference records.")
          PY
      - name: Run published equations versus no-covariate baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_published && !inputs.full_cohort }}
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ inputs.smoke_only }}" = "true" ]; then
            python -u Examples/PropofolCovariates/compare_published.py --train-patients 10 --test-patients 5 --train-steps 20 --test-steps 10 --global-samples "${{ inputs.global_samples }}" --output-csv propofol-published-smoke.csv 2>&1 | tee propofol-published-run.log
          else
            python -u Examples/PropofolCovariates/compare_published.py --train-steps 1000 --test-steps 300 --global-samples "${{ inputs.global_samples }}" --output-csv propofol-published-dev.csv 2>&1 | tee propofol-published-run.log
          fi
      - name: Run full published equations comparison
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_published && inputs.full_cohort && !inputs.smoke_only }}
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/compare_published.py --full --train-steps 2000 --test-steps 500 --global-samples "${{ inputs.global_samples }}" --output-csv propofol-published-full.csv 2>&1 | tee propofol-published-run.log
      - name: Upload paired held-out errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propofol-development-paired-scores
          path: |
            propofol-dev-scores.csv
            propofol-published-smoke.csv
            propofol-published-dev.csv
            propofol-published-full.csv
            propofol-published-run.log
            propofol-full-scores.csv
            propofol-full-run.log
            propofol-smoke-scores.csv
            propofol-smoke-run.log
            propofol-dev-eleveld.csv
            propofol-dev-scipy.csv
            propofol-download.log
            propofol-data-check.log
            propofol-eleveld-run.log
            propofol-scipy-reference.log
            propofol-dev-run.log
          if-no-files-found: ignore
