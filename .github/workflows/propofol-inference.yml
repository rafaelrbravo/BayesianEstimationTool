name: Propofol development inference

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/propofol-inference.yml"

jobs:
  development-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install BET and numerical dependencies
        run: python -m pip install -e . numpy pandas scipy "jax[cpu]" numpyro
      - name: Download upstream data
        run: python Examples/PropofolCovariates/download_data.py
      - name: Check patient universe and measurements
        run: python Examples/PropofolCovariates/inspect_data.py
      - name: Run development comparison (100 train, up to 25 test)
        run: python Examples/PropofolCovariates/compare_covariates.py --train-steps 1000 --test-steps 300 --output-csv propofol-dev-scores.csv
      - name: Upload paired held-out errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propofol-development-paired-scores
          path: propofol-dev-scores.csv
          if-no-files-found: ignore
