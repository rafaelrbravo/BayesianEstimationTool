name: Propofol development inference

on:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: "Run only the 10-patient SVI smoke test (skip development fit)"
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/propofol-inference.yml"
      - "Examples/PropofolCovariates/**"
      - "BayesianEstimationTool/**"
      - "pyproject.toml"
      - "setup.py"

jobs:
  development-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install BET and numerical dependencies
        run: python -m pip install -e . numpy pandas scipy "jax[cpu]" numpyro pytest
      - name: Run synthetic regression tests before inference
        run: python -m pytest -q Examples/PropofolCovariates/test_*.py
      - name: Download upstream data
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/download_data.py 2>&1 | tee propofol-download.log
      - name: Check patient universe and measurements
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/inspect_data.py 2>&1 | tee propofol-data-check.log
      - name: Score supplied Eleveld parameters on development test patients
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/eleveld_reference.py --development --output-csv propofol-dev-eleveld.csv 2>&1 | tee propofol-eleveld-run.log
      - name: Independently score Eleveld with SciPy
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/scipy_reference.py 2>&1 | tee propofol-scipy-reference.log
      - name: Run minimal end-to-end SVI smoke test
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/compare_covariates.py --train-patients 10 --test-patients 5 --train-steps 20 --test-steps 10 --output-csv propofol-smoke-scores.csv 2>&1 | tee propofol-smoke-run.log
      - name: Summarize smoke-test paired held-out errors
        run: python Examples/PropofolCovariates/summarize_scores.py propofol-smoke-scores.csv
      - name: Run development comparison (100 train, up to 25 test)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.smoke_only }}
        shell: bash
        run: |
          set -o pipefail
          python -u Examples/PropofolCovariates/compare_covariates.py --train-steps 1000 --test-steps 300 --output-csv propofol-dev-scores.csv 2>&1 | tee propofol-dev-run.log
      - name: Summarize exported paired held-out errors
        if: ${{ success() && github.event_name == 'workflow_dispatch' && !inputs.smoke_only }}
        run: python Examples/PropofolCovariates/summarize_scores.py propofol-dev-scores.csv
      - name: Upload paired held-out errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propofol-development-paired-scores
          path: |
            propofol-dev-scores.csv
            propofol-smoke-scores.csv
            propofol-smoke-run.log
            propofol-dev-eleveld.csv
            propofol-download.log
            propofol-data-check.log
            propofol-eleveld-run.log
            propofol-scipy-reference.log
            propofol-dev-run.log
          if-no-files-found: ignore
