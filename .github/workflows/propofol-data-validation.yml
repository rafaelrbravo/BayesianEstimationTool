name: Propofol upstream data validation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/propofol-data-validation.yml"
      - "Examples/PropofolCovariates/download_data.py"
      - "Examples/PropofolCovariates/inspect_data.py"
      - "Examples/PropofolCovariates/load_data.py"
      - "Examples/PropofolCovariates/example.py"
      - "Examples/PropofolCovariates/test_*.py"
      - "Examples/PropofolCovariates/compare_covariates.py"
  pull_request:
    paths:
      - ".github/workflows/propofol-data-validation.yml"
      - "Examples/PropofolCovariates/download_data.py"
      - "Examples/PropofolCovariates/inspect_data.py"
      - "Examples/PropofolCovariates/load_data.py"
      - "Examples/PropofolCovariates/example.py"
      - "Examples/PropofolCovariates/test_*.py"
      - "Examples/PropofolCovariates/compare_covariates.py"

jobs:
  validate-upstream-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dataset dependencies
        run: python -m pip install -e . numpy pandas scipy "jax[cpu]" numpyro pytest
      - name: Run propofol synthetic regression tests
        run: python -m pytest -q Examples/PropofolCovariates/test_*.py
      - name: Download original upstream CSVs
        run: python Examples/PropofolCovariates/download_data.py
      - name: Validate upstream patient and measurement counts
        run: python Examples/PropofolCovariates/inspect_data.py
      - name: Validate full event loader and units
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "Examples/PropofolCovariates")
          import numpy as np
          from load_data import load_data
          data = load_data()
          assert len(data["patient_ids"]) == 1031
          assert np.isfinite(data["time"]).all()
          assert np.isfinite(data["rate"]).all()
          assert np.isfinite(data["bolus"]).all()
          assert np.isfinite(data["covariates"]).all()
          assert np.all(data["rate"] >= 0)
          assert np.all(data["bolus"] >= 0)
          assert np.all(data["concentration"][data["observed"].astype(bool)] > 0)
          assert np.all(np.diff(data["time"], axis=1) >= 0)
          print("Validated", len(data["patient_ids"]), "patients and", int(data["observed"].sum()), "concentrations")
          PY
      - name: Validate simplified standalone example loader against upstream data
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import shutil
          from urllib.request import urlopen

          path = Path("Examples/PropofolCovariates/example.py")
          tree = ast.parse(path.read_text())
          keep = {"DATA_DIR", "UPSTREAM_COMMIT", "BASE_URL", "FILES"}
          nodes = [node for node in tree.body if
                   isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id in keep for t in node.targets)
                   or isinstance(node, ast.FunctionDef) and node.name == "load_data"]
          namespace = {"Path": Path, "np": np, "pd": pd, "shutil": shutil, "urlopen": urlopen}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), str(path), "exec"), namespace)
          data = namespace["load_data"]()
          assert len(data["patient_ids"]) == 1031
          assert data["covariates"].shape == (1031, 5)
          assert all(data[key].shape == data["time"].shape for key in ("rate", "bolus", "observed", "concentration"))
          assert np.all(np.isfinite(data["covariates"]))
          assert np.all(np.diff(data["time"], axis=1) >= 0)
          assert np.all(data["rate"] >= 0) and np.all(data["bolus"] >= 0)
          assert np.all(data["concentration"][data["observed"].astype(bool)] > 0)
          print("Standalone loader passed:", len(data["patient_ids"]), "patients;", int(data["observed"].sum()), "observations")
          PY
      - name: Score supplied Eleveld parameters on held-out development patients
        run: python -u Examples/PropofolCovariates/eleveld_reference.py --development --output-csv propofol-dev-eleveld.csv
      - name: Upload independent Eleveld reference scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: propofol-data-validation-eleveld-reference
          path: propofol-dev-eleveld.csv
          if-no-files-found: ignore
