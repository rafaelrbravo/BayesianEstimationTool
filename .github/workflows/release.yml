name: Build and publish package

on:
  push:
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag must match pyproject.toml version"
          PY
      - name: Check manual and examples stay synchronized
        run: python tests/check_manual_examples.py
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/bet-release-check
          /tmp/bet-release-check/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/bet-release-check/bin/python -c "import BayesianEstimationTool as bet; assert hasattr(bet, 'Estimator')")
      - name: Verify bundled examples and PDFs
        run: |
          mkdir -p /tmp/bet-resource-check
          (cd /tmp/bet-resource-check && /tmp/bet-release-check/bin/python -m BayesianEstimationTool.ExampleInstaller)
          test -f /tmp/bet-resource-check/BET-Examples/1_SimpleExampleNuts.py
          test -f /tmp/bet-resource-check/BET-Examples/Documentation/Manual.pdf
          test -f /tmp/bet-resource-check/BET-Examples/Documentation/Cheatsheet.pdf
          if (cd /tmp/bet-resource-check && /tmp/bet-release-check/bin/python -m BayesianEstimationTool.ExampleInstaller); then
            echo "Installer incorrectly overwrote existing destination" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub Release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/BayesianEstimationTool/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

