name: Build and publish package

on:
  push:
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set build version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit(f'Invalid release tag: {tag}')
          path = Path('pyproject.toml')
          content = path.read_text(encoding='utf-8')
          updated, count = re.subn(r'(?m)^(version\s*=\s*")[^"]+(")$', lambda m: m.group(1) + tag[1:] + m.group(2), content)
          if count != 1:
              raise SystemExit(f'Expected one project version, found {count}')
          path.write_text(updated, encoding='utf-8')
          print(f'Building BET version {tag[1:]}')
          PY
      - name: Check manual and examples stay synchronized
        run: python tests/check_manual_examples.py
      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Verify distribution versions against release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from packaging.utils import parse_wheel_filename, parse_sdist_filename
          expected = (os.environ['RELEASE_TAG'][1:] if os.environ['IS_TAG_RELEASE'] == 'true'
                      else tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          wheels = list(Path('dist').glob('*.whl'))
          sources = list(Path('dist').glob('*.tar.gz'))
          assert len(wheels) == 1 and len(sources) == 1, f'Unexpected distributions: {wheels}, {sources}'
          for wheel in wheels:
              name, version, _, _ = parse_wheel_filename(wheel.name)
              assert name == 'bayesianestimationtool' and str(version) == expected, f'Unexpected wheel: {wheel}'
          for source in sources:
              name, version = parse_sdist_filename(source.name)
              assert name == 'bayesianestimationtool' and str(version) == expected, f'Unexpected sdist: {source}'
          print(f'Validated BET distribution version {expected}')
          PY
      - name: Verify wheel installation
        run: |
          python -m venv /tmp/bet-release-check
          /tmp/bet-release-check/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/bet-release-check/bin/python -c "import BayesianEstimationTool as bet; assert hasattr(bet, 'Estimator')")
      - name: Verify bundled examples and PDFs
        run: |
          mkdir -p /tmp/bet-resource-check
          (cd /tmp/bet-resource-check && /tmp/bet-release-check/bin/python -m BayesianEstimationTool.ExampleInstaller)
          test -f /tmp/bet-resource-check/BET-Examples/1_SimpleExampleNuts.py
          test -f /tmp/bet-resource-check/BET-Examples/Documentation/Manual.pdf
          test -f /tmp/bet-resource-check/BET-Examples/Documentation/Cheatsheet.pdf
          if (cd /tmp/bet-resource-check && /tmp/bet-release-check/bin/python -m BayesianEstimationTool.ExampleInstaller); then
            echo "Installer incorrectly overwrote existing destination" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Create GitHub Release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/BayesianEstimationTool/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

