name: Refresh documentation PDFs
on:
  push:
    branches: [main]
    paths:
      - 'docs/*.md'
      - 'docs/generators/*.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests playwright
      - run: python -m playwright install --with-deps chromium
      - name: Generate PDFs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python docs/generators/markdown_to_pdf.py docs/Manual.md
          python docs/generators/markdown_to_pdf.py docs/Cheatsheet.md
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf
          git diff --cached --quiet || (git commit -m "Refresh BET PDFs" && git push)
