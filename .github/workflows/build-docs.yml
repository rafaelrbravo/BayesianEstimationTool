name: Build BET documentation
on:
  push:
    branches: [docs/dual-format-manual-cheatsheet]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jax[cpu]' numpyro pytest reportlab
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Generate and validate documentation PDFs
        run: |
          python docs/generators/manual.py
          python docs/generators/cheatsheet.py
          python -c 'from pypdf import PdfReader; n=len(PdfReader("docs/Cheatsheet.pdf").pages); print(f"Cheatsheet pages: {n}"); assert n == 1, f"Expected one-page cheatsheet, got {n} pages"'
      - name: Run complete BET suite from parent directory
        run: cd .. && python -m pytest -q BayesianEstimationTool/tests
  generate:
    # Publishing requires write access; skip this job for untrusted PR code.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=5,<7'
      - run: |
          python docs/generators/manual.py
          python docs/generators/cheatsheet.py
      - name: Verify generated manuals are non-empty
        run: python -c 'from pathlib import Path; from pypdf import PdfReader; files=[Path("docs/Manual.md"),Path("docs/Cheatsheet.md")]; assert all(p.exists() and p.stat().st_size > 0 for p in files); assert len(PdfReader("docs/Manual.pdf").pages) > 0'
      - name: Verify cheatsheet is exactly one PDF page
        run: python -c 'from pypdf import PdfReader; n=len(PdfReader("docs/Cheatsheet.pdf").pages); print(f"Cheatsheet pages: {n}"); assert n == 1, f"Expected one-page cheatsheet, got {n} pages"'
      - name: Upload generated documentation for review
        uses: actions/upload-artifact@v4
        with:
          name: bet-docs
          path: |
            docs/Manual.md
            docs/Manual.pdf
            docs/Cheatsheet.md
            docs/Cheatsheet.pdf
      - name: Commit generated docs
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Manual.md docs/Manual.pdf docs/Cheatsheet.md docs/Cheatsheet.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate BET manual and cheatsheet in Markdown and PDF'
            git push origin HEAD:refs/heads/${{ github.ref_name }}
          fi
