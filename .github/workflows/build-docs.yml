name: Build BET documentation
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jax[cpu]' numpyro pytest reportlab requests playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip install 'pypdf>=5,<7'
      - name: Generate and validate documentation PDFs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python docs/generators/markdown_to_pdf.py docs/Manual.md
          python docs/generators/cheatsheet.py
          python -c 'from pypdf import PdfReader; n=len(PdfReader("docs/Cheatsheet.pdf").pages); print(f"Cheatsheet pages: {n}"); assert n == 1, f"Expected one-page cheatsheet, got {n} pages"'
      - name: Run complete BET suite from parent directory
        run: cd .. && python -m pytest -q BayesianEstimationTool/tests
  generate:
    # Generate review artifacts only; PDF refresh workflow commits PDFs.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5' 'pypdf>=5,<7' requests playwright
      - run: python -m playwright install --with-deps chromium
      - run: |
          python docs/generators/markdown_to_pdf.py docs/Manual.md
          python docs/generators/cheatsheet.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify generated manuals are non-empty
        run: python -c 'from pathlib import Path; from pypdf import PdfReader; files=[Path("docs/Manual.md"),Path("docs/Cheatsheet.md")]; assert all(p.exists() and p.stat().st_size > 0 for p in files); assert len(PdfReader("docs/Manual.pdf").pages) > 0'
      - name: Verify cheatsheet is exactly one PDF page
        run: |
          python -c 'from pypdf import PdfReader; n=len(PdfReader("docs/Cheatsheet.pdf").pages); print(f"Cheatsheet pages: {n}"); assert n == 1, f"Expected one-page cheatsheet, got {n} pages"'
      - name: Upload generated documentation for review
        uses: actions/upload-artifact@v4
        with:
          name: bet-docs
          path: |
            docs/Manual.md
            docs/Manual.pdf
            docs/Cheatsheet.md
            docs/Cheatsheet.pdf
