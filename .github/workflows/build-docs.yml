name: Build BET documentation
on:
  push:
    branches: [docs/dual-format-manual-cheatsheet]
    paths:
      - 'docs/generators/**'
      - '.github/workflows/build-docs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'reportlab>=4,<5'
      - run: |
          python docs/generators/manual.py
          python docs/generators/cheatsheet.py
      - name: Commit generated docs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/Manual.md docs/Manual.pdf docs/Cheatsheet.md docs/Cheatsheet.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate BET manual and cheatsheet in Markdown and PDF'
            git push
          fi
