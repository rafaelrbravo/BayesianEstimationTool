name: Propofol synthetic regression tests

on:
  push:
    paths:
      - "Examples/PropofolCovariates/**"
      - "BayesianEstimationTool/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/propofol-tests.yml"
  pull_request:
    paths:
      - "Examples/PropofolCovariates/**"
      - "BayesianEstimationTool/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/propofol-tests.yml"
  workflow_dispatch:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install BET and test dependencies
        run: python -m pip install -e . numpy pandas scipy "jax[cpu]" numpyro pytest
      - name: Run all propofol synthetic tests
        run: python -m pytest -q Examples/PropofolCovariates/test_*.py
