name: Package installation smoke test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: |
          python -m venv /tmp/bet-install
          /tmp/bet-install/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/bet-install/bin/python -c "import BayesianEstimationTool as bet; assert hasattr(bet, 'Estimator'); assert hasattr(bet, 'Nuts'); assert hasattr(bet, 'Svi')"
